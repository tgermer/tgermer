---
layout: container
title: Portfolio
---

<section class="mb-5"></section> <!-- Dummy element to avoid margin collaps -->

<!-- Projekt-Vorschau -->
<section id="portfolios" class="container mb-5">
    <h2 class="mb-4">Meine Projekte</h2>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 justify-content-start g-4">
      {% for portfolio in site.portfolios %}
      <div class="col">
        <!-- Klickbare Karte mit Bootstrap-Hover-Effekt -->
        <a href="{{ portfolio.url }}" 
           class="card h-100 d-flex flex-column text-decoration-none shadow-sm" 
           style="position: relative; transition: transform 0.3s, box-shadow 0.3s;">
          <!-- Bild oder Ersatz-Text -->
          <img src="{{ portfolio.image }}" class="card-img-top" alt="...">
          <!--<div 
            class="card-img-top bg-secondary bg-gradient bg-image ratio ratio-21x9 d-flex align-items-center justify-content-center text-center" 
            style="font-size: 1.25rem; font-weight: bold;">
            {% if portfolio.image %}
              <div 
                style="background-image: url('{{ portfolio.image }}'); 
                       background-size: cover; 
                       background-position: center; 
                       width: 100%; 
                       height: 100%;"></div>
            {% else %}
              {{ portfolio.title }}
            {% endif %}-->
          </div>
          <div class="card-body d-flex flex-column">
            <p class="card-text"><small class="text-body-secondary">{{ portfolio.type }}</small></p>
            <h5 class="card-title">{{ portfolio.title }}</h5>
            <h6 class="card-subtitle mb-2 text-body-secondary mb-4">{{ portfolio.description }}</h6>
            <span class="btn btn-primary mt-auto">Mehr erfahren</span>
          </div>
        </a>
      </div>
      {% endfor %}
    </div>
</section>

<!-- Zusätzlicher Hover-Stil -->
<style>
  .card:hover {
    transform: scale(1.02); /* Vergrößerung */
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15); /* Größerer Schatten */
  }
</style>
