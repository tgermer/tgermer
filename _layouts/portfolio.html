---
layout: container
---

<div class="container mb-5">
    <p class="lead">{{ page.description }}</p>
    {% if page.image != nil %}
    <div class="ratio ratio-21x9 rounded-4 mb-5 bg-secondary bg-gradient bg-image">
        <div style="background-image: url('{{ page.image }}'); 
                       background-size: cover; 
                       background-position: center; 
                       width: 100%; 
                       height: 100%;">
        </div>
    </div>
    {% endif %}
    <a href="{{ page.link }}" target="_blank" class="btn btn-primary">Code auf GitHub ansehen</a>
</div>

<div class="container mb-5">
    {{ content }}
</div>

<div class="container mb-5">
    <h3>Technologien</h3>
    <p>{{ page.technologies }}</p>
</div>

<div class="container">
    <a href="/portfolio" class="btn btn-outline-secondary">Zurück zu allen Projekten</a>
</div>
