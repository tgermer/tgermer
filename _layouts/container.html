---
layout: default
---

<article class="">

  <header class="post-header">
    <h1 class="post-title container">{% if page.lang == 'de' %}{{ page.title | escape }}{% else %}{{ page.title | escape }}{% endif %}</h1>
  </header>
  <div class="container">
    <p class="float-end small d-print-none">
      {% if page.lang == 'en' %}
      <a href="{{ site.baseurl }}/cv_de/" class="btn btn-outline-primary">In Deutsch ansehen</a>
      {% elsif page.lang == 'de' %}
      <a href="{{ site.baseurl }}/cv_en/" class="btn btn-outline-primary">View in English</a>
      {% endif %}
    </p>
  </div>


  <div class="post-content">
    {{ content }}
  </div>

</article>
