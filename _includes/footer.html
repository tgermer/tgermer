<footer class="mt-5">
  <div class="container text-center text-md-start border-top pt-3">
    <small>
      <div class="row">
        <div class="col-md-3 col-sm-6">
          <p>&copy; 2010–{{ "now" | date: "%Y" }} by {{ site.author }}</p>
        </div>
        <div class="col-md-3 col-sm-6">
          <h4>Navigation</h4>
          {% for item in site.data.navigation %}
          <a href="{{ site.baseurl }}{{ item.link }}">{{ item.name }}</a>
          <br>
          {% endfor %}
        </div>
        <div class="col-md-3 col-sm-6">
          <h4>Kontakt</h4>
          <p><span class="glyphicon glyphicon-earphone" aria-hidden="true"></span> {{ site.phone }}
            <br>
            <span class="glyphicon glyphicon-envelope" aria-hidden="true"></span> <a href="mailto:{{ site.email }}">{{ site.email }}</a>
            <br>
          </p>
        </div>
      </div>
    </small>
    <div class="text-center text-muted mt-3">
      <!-- <p><small>Folge uns auf</small></p>
      <p>{% include socialLinks.html %}</p> -->
    </div>
  </div>
  <div class="copyright bg-body-tertiary">
    <div class="container">
      <div class="row small text-center">
        <div class="col-md-4 text-md-start">
          <a href="{{ site.baseurl }}{{ site.url_imprint }}">
            Impressum</a> | <a href="{{ site.baseurl }}{{ site.url_privacy_statement }}">
            Datenschutzerklärung</a>
        </div>
        <div class="col-md-4 text-center">
          Made with <span class="font-rot">♥</span>
        </div>
        <div class="col-md-4 text-md-end">
          <a href="mailto:{{ site.webmaster_email }}?subject=Website%20{{ site.title }}">
            Webmaster</a>
        </div>
      </div>
    </div>
  </div>
</footer>
