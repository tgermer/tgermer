{% for reference in site.data.cv_de.references %}
<div class="row mt-3">
  <div class="col-md-8 offset-md-4 col-lg-9 offset-lg-3 col-xl-10 offset-xl-2">
    <h4>{{ reference.name }}</h4>
    <p>{{ reference.company | upcase }}
      <br>{{ reference.position }}{% if reference.department %}; {{ reference.department }}{% endif %}
      <br><a href="mailto:{{ referece.email }}">{{ reference.email }}</a>
    </p>
    <hr>
  </div>
</div>
{% endfor %}
